# BB Kitsu pipeline - default configuration
#
# Everything the pipeline knows about naming and layout lives here rather than
# in code, so the studio can retarget the tool without a release. Copy this
# file, edit it, and point BB_PIPELINE_CONFIG at the copy to override.

[naming]
# Field values are sanitized down to this character set. Underscore is
# deliberately excluded: it is the field separator, and keeping it out of the
# values is what lets a finished name be parsed back into a context.
allowed = "A-Za-z0-9.-"
replacement = "-"
version_padding = 3

# The thing and its version, and nothing the folders above already say:
#   Kitchen-counter_v003.blend, in .../assets/Prop/Kitchen-counter/Modeling/
#
# The trade-off is deliberate. A name spelling out the whole context could be
# read back into one from the filename alone, which mattered when files were
# passed around loose; a file that lives in the pipeline is identified by
# where it sits and by the context stamped inside it, and the long name was
# repeating the folders four times over. Put {project}_{group}_{entity}_{task}
# back here for a studio that needs self-describing filenames.
base = "{entity}"
versioned = "{base}_v{version}"

[paths]
# Filled in from add-on preferences at runtime; left blank so a misconfigured
# install fails loudly instead of writing somewhere unexpected.
work_root = ""
render_root = ""

# The roots are the project folder - one show per root, set per project, so
# the layout below starts inside it. A studio keeping several shows under one
# shared root prefixes these with "{project}/" instead.
#
# Work files sit flat in a per-task folder; the version is in the filename.
# {group}/{entity} is sequence/shot for a shot and asset type/asset for an
# asset, so the two trees are kept apart by their own prefix rather than by
# hoping a sequence is never named the same as an asset type.
work_dir_shot = "{group}/{entity}/{task}"
work_dir_asset = "assets/{group}/{entity}/{task}"
work_file = "{versioned}.{ext}"

# Renders get a version *folder*, one level under a per-stream folder, so a
# single version can emit several parallel outputs.
# Nothing here repeats what the folders above it already say. The project is
# the root, the entity and task are folders, so the file only has to name the
# thing and its version - enough to still be identifiable if it is copied out
# on its own, and no more.
render_dir_shot = "{group}/{entity}/{task}/Render/{stream}/v{version}"
render_dir_asset = "assets/{group}/{entity}/{task}/Render/{stream}/v{version}"
render_stem = "{entity}_v{version}"
# Except a shot's, which carry the show and the sequence as well. Shot renders
# are the ones that leave the folders that name them - into an edit, a review,
# another department's comp - and once there, sh010_v003 from six shows are
# indistinguishable. The sequence is in it too because shot names are not
# unique on their own: a show can have three shots called 01 in three
# sequences. Assets keep the short form above; theirs rarely travel.
render_stem_shot = "{project}_{group}_{entity}_v{version}"
render_file = "{stem}.{frame}.{ext}"

# Per-project overrides, for shows that do not live under the common root.
# Anything valid under [paths] can be overridden here, matched against the
# project code (or its name, when no code is set in Kitsu) case-insensitively:
#
#   [projects.PizzaHunt]
#   work_root = "I:/PizzaHunt"
#   render_root = "I:/PizzaHunt/_renders"

# Each DCC only offers the tasks it is actually used for, filtered on the
# Kitsu department the task type belongs to. Leave `departments` out to offer
# every task. Names are matched case-insensitively; a task type with no
# department is only offered when `departments` is absent.
[dcc.blender]
ext = "blend"
departments = ["Animation", "FX", "Layout", "Lighting", "Modeling"]

[dcc.nuke]
ext = "nk"
departments = ["Compositing", "2D"]

[dcc.maya]
ext = "ma"
# ASCII rather than .mb on purpose: the context stamp lives in fileInfo, and
# in a .ma that is a greppable line of text. A stamp that can be read - and
# repaired - without opening Maya has already paid for the file size once.
#
# The overlap with Blender's list is deliberate, unlike Resolve's. Two DCCs
# claiming Modeling is a studio that models in both, and each shows the same
# task with its own files under it. Resolve's list avoids Compositing for a
# different reason entirely: there it would break Import.
departments = ["Animation", "FX", "Layout", "Lighting", "Modeling",
               "Rigging", "Shading", "Texture"]

[dcc.resolve]
ext = "drp"
# Resolve's own work, not copy-pasted from Nuke's list: grading and
# editorial is what it is actually used for. Deliberately does NOT claim
# Compositing/2D - Nuke already does, and a task both DCCs think they author
# is a task whose renders Resolve's Browse tab never offers to Import,
# because it looks like one of Resolve's own project-workflow tasks instead.
# A studio that really does comp in Resolve can add them back in a
# config.toml override.
departments = ["Color", "Color Grading", "Editing", "Editorial"]

# Parallel outputs derivable from one render context. Only `main` is wired up
# yet; the rest are here so the shape is settled before the render side lands.
# The stream is which parallel output this is - the full-quality render, a
# proxy, an offline with burn-ins, a matte pass. Only `main` is wired up so
# far, and it deliberately has no folder of its own: a directory called
# `main` next to nothing else says nothing. Give a stream a folder and it
# appears in the path; leave it empty and it does not.
[streams.main]
folder = ""
ext = "exr"
colorspace = "ACES - ACEScg"

[streams.proxy]
folder = "proxy"
ext = "exr"
colorspace = "ACES - ACEScg"
resolution_scale = 0.5

[streams.offline]
folder = "offline"
ext = "mov"
colorspace = "Output - Rec.709"
burn_in = true

# Viewport playblasts, as a PNG sequence. This used to be H.264 on the grounds
# that nothing downstream needed the frames - but BB AnimViewer flips through
# frames and cannot play a movie, and the Kitsu Review panel builds the H.264
# for Kitsu out of frames anyway. Set "mp4" to get one movie file straight
# out instead; the Blender side reads this rather than assuming either.
[streams.playblast]
folder = "playblast"
ext = "png"
colorspace = "Output - Rec.709"

[streams.matte]
folder = "matte"
ext = "exr"
colorspace = "ACES - ACES2065-1"

[streams.plate]
folder = "plate"
ext = "exr"
colorspace = "ACES - ACES2065-1"
